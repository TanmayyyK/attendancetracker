<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050A18" />
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1024" height="1024" fill="url(#bg)" />
  
  <g transform="translate(262, 262)">
    <rect x="0" y="0" width="500" height="500" rx="100" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="10" />
    <path d="M 150 250 L 220 320 L 350 160" fill="none" stroke="url(#check)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  </g>
</svg>
